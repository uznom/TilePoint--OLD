<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <!-- Strict Anti-Crawler and Web Scraper Directives -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noodp, noydir" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, max-image-preview:none, max-snippet:0" />
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="slurp" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="duckduckbot" content="noindex, nofollow" />
    <meta name="baiduspider" content="noindex, nofollow" />
    <meta name="yandexbot" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    
    <title>TilePoint - POS & Multi-Branch Ledger</title>
    
    <!-- PWA Metadata & Favicons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Standalone install optimizations -->
    <meta name="theme-color" content="#1c1b1f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TilePoint" />
    <meta name="application-name" content="TilePoint" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker registration script -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then((registration) => {
              console.log('[PWA] TilePoint PWA Service Worker registered successfully:', registration.scope);
              
              // Handle update checking on intervals to make sure updates are processed proactively
              setInterval(() => {
                registration.update().catch((err) => {
                  console.debug('[PWA Update Check] Update check skipped or network busy:', err);
                });
              }, 120000); // check for updates every 120 seconds

              registration.addEventListener('updatefound', () => {
                const installingWorker = registration.installing;
                if (installingWorker) {
                  installingWorker.addEventListener('statechange', () => {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('[PWA Update Core] New update downloaded. Triggering skipWaiting...');
                      installingWorker.postMessage({ action: 'skipWaiting' });
                    }
                  });
                }
              });
            })
            .catch((error) => {
              if (error && (error.name === 'SecurityError' || String(error).includes('SSL') || String(error).includes('SecurityError'))) {
                console.info('[PWA] Service Worker registration paused (Self-Signed SSL Certificate on LAN IP). TilePoint operating in web mode. To enable full PWA offline caching on LAN IP, trust tilepoint-ca.crt in Windows Root store or use Chrome flag #unsafely-treat-insecure-origin-as-secure.');
              } else {
                console.warn('[PWA] TilePoint PWA Service Worker registration failed:', error);
              }
            });
        });

        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            console.log('[PWA Lifecycle] Controller changed. Reloading page...');
            window.location.reload();
          }
        });
      }
    </script>
  </body>
</html>
